<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles.css">
        <title>Reverifi</title>
    </head>
    <body>
        <header> 
            <nav id="header-nav">
                <button class="menu-button">
                    <span class = "header-burger-button"></span>
                    <span class = "header-burger-button"></span>
                    <span class = "header-burger-button"></span>
                </button> 
                <img src="./assets/logo-reverifi.svg" alt="Reverifi's logo" id="header-logo">
                <section id="header-left-anchors"> 
                    <a> How we Work </a>
                    <a> Find an Agent </a>
                    <a> Knowledge Center </a>
                </section>
                <section id="header-right-anchors">
                    <a> Sign In </a>
                    <a id="anchor-join-now"> Join Now </a>
                </section>
            </nav>
        </header>

        <main>
            <section id="search-bar-home-section"> 
                <div id="hero-left">
                    <h1> 
                        Search our listings for your next purchase                
                    </h1>
                    <div class="search-bar-container">
                        <img src="./assets/icons/location-icon.svg" alt="Location Icon">
                        <input type="text" placeholder="Enter City, neighborhood, ZIP, or address" class="search-input">
                        <img src="./assets/icons/Search-Icon.svg" alt="Search icon" id="header-search-icon">
                    </div>
                </div>

                <img src="./assets/home-illustration.svg" alt="Image with a family and a home" id="home-illustration"> 
            </section>

            <section id="featured-listing-section">
                <h2>Our Featured Listing</h2>  
                <div id="cards">
                    <div id="card-visuals">
                        <span class="badge-new">New</span>
                        <img src="./assets/apartment1.svg" alt="Apartment image" class="featured-listing-card"> 
                        <img src="./assets/seller-picture.svg" alt="Seller picture" class="card-seller-picture">
                    </div>

                    <div class="card-description">
                        <div class="card-description-top"> 
                            <p class="apartment-name">Apartment#1</p>
                            <p class="apartment-direction"> Bronx, NY 10459</p>
                        </div>
                        <p class="apartment-distance"><img src="assets/icons/location-icon.svg" alt="Location icon" id="location-icon-card-description" >1.1km away</p>
                    </div>
                    <div class="card-icons">
                        <p>
                            <span class="faded-text">2</span>
                            <img src="assets/icons/bedroom.svg" alt="Bedroom icon" >
                        </p>
                        <img src="assets/icons/wifi.svg" alt="Wifi icon">

                        <p>
                            <span class="faded-text">1</span>
                            <img src="assets/icons/bathtub.svg" alt="Bathtub icon">
                        </p>
                        <img src="assets/icons/air-conditioner.svg" alt="Air conditioner icon">
                        <img src="assets/icons/bench.svg" alt="Air conditioner icon">
                    </div>
                    <hr id="price-divisor">
                </div>  
                <div> 
                    <div class="social-icons">
                        <h3>30,000</h3>
                        <img src="assets/icons/heart-icon.svg" alt="Heart icon">
                        <img src="assets/icons/share.svg" alt="Share icon">
                    </div>
                </div>
            </section>
        </main>

        <footer>

        </footer>
    </body>
</html>
